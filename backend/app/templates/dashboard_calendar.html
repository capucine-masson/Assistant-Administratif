{% extends "base.html" %}
{% block title %}Calendrier des démarches{% endblock %}
{% block content %}

<div class="flex items-center justify-between flex-wrap gap-3 mb-4">
    <div class="flex flex-wrap gap-2 text-sm">
        <span class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white border border-slate-200">
            <i data-lucide="list-checks" class="w-4 h-4 text-primary"></i> {{ demarches|length }} démarches
        </span>
        {% if counts.overdue %}
        <span class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-red-100 text-red-700">
            <i data-lucide="triangle-alert" class="w-4 h-4"></i> {{ counts.overdue }} en retard
        </span>
        {% endif %}
    </div>
    <button type="button" class="js-open-chatbot flex items-center gap-1.5 bg-primary text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-primary-600">
        <i data-lucide="plus" class="w-4 h-4"></i> Nouvelle démarche
    </button>
</div>

{% include "_filters_bar.html" %}

<div class="bg-white rounded-2xl border border-slate-200 p-4">
    <div class="flex items-center justify-between flex-wrap gap-3 mb-3">
        <div class="flex items-center gap-1">
            <button type="button" id="cal-prev" class="cal-nav-btn"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
            <button type="button" id="cal-today" class="cal-nav-btn wide">Aujourd'hui</button>
            <button type="button" id="cal-next" class="cal-nav-btn"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
        </div>
        <h2 id="cal-title" class="font-title text-primary text-lg capitalize"></h2>
        <div class="flex bg-slate-100 rounded-xl p-1 text-sm">
            <button type="button" class="cal-mode-btn" data-mode="month">Mois</button>
            <button type="button" class="cal-mode-btn" data-mode="six">6 mois</button>
            <button type="button" class="cal-mode-btn" data-mode="year">Année</button>
            <button type="button" class="cal-mode-btn" data-mode="list">Liste</button>
        </div>
    </div>

    <div id="calendar-fc"
         data-category-id="{{ filters.category_id or '' }}"
         data-person-id="{{ filters.person_id or '' }}"
         data-status="{{ filters.status or '' }}"></div>
    <div id="calendar-overview" class="hidden"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="/static/js/calendar.js?v={{ asset_version }}"></script>
{% endblock %}
